<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#g)"/>

  <!-- notific mark: stacked notifications / tiles -->
  <g filter="url(#soft)">
    <rect x="150" y="150" width="212" height="132" rx="28" fill="#22c55e" opacity="0.92"/>
    <rect x="130" y="210" width="252" height="152" rx="32" fill="#60a5fa" opacity="0.92"/>
    <rect x="172" y="248" width="168" height="28" rx="14" fill="#0b1220" opacity="0.6"/>
    <rect x="172" y="292" width="126" height="28" rx="14" fill="#0b1220" opacity="0.6"/>

    <!-- small "ping" dot -->
    <circle cx="368" cy="210" r="14" fill="#f97316"/>
  </g>

  <!-- subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#334155" stroke-width="8" opacity="0.6"/>
</svg>
